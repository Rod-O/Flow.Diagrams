name: Catalog to GitHub Pages

on:
  push:
    branches: [nodecad]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publish the catalog
        run: dotnet publish samples/Catalog -c Release -o out
      - name: Build the API reference into /reference
        run: |
          dotnet tool install -g docfx --version 2.78.4
          apidocs/build.sh
          cp -R apidocs/_site out/wwwroot/reference
      - name: Serve under /Flow.Diagrams/
        working-directory: out/wwwroot
        run: |
          sed -i 's#<base href="/" />#<base href="/Flow.Diagrams/" />#' index.html
          # Pages answers unknown paths with 404.html, so deep links still boot the app.
          cp index.html 404.html
          touch .nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
