name: Changelog fragment

# A pull request that changes the packages (src/) must add a changelog.d/ fragment, unless labelled no-changelog.
# See changelog.d/README.md.

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  fragment:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fragment present when src/ changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only --diff-filter=ACMRD "$BASE"...HEAD)
          if ! echo "$changed" | grep -q '^src/'; then
            echo "No package source changed."
            exit 0
          fi
          fragments=$(git diff --name-only --diff-filter=A "$BASE"...HEAD -- changelog.d | grep -v '^changelog.d/README.md$' || true)
          if [ -z "$fragments" ]; then
            echo "::error::src/ changed but no changelog.d/ fragment was added. Add changelog.d/<branch>.<type>.md (see changelog.d/README.md) or label the pull request no-changelog."
            exit 1
          fi
          echo "Fragments: $fragments"
      - name: Fragments are well formed
        run: python3 tools/prepare-release.py 0.0.0-check --dry-run > /dev/null || [ -z "$(ls changelog.d | grep -v README.md)" ]
