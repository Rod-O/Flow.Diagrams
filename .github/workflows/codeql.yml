name: CodeQL

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  security-events: write
  contents: read
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
      - name: Build
        run: dotnet build Flow.Diagrams.sln -c Release
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
